<!DOCTYPE html>
<html>
<head>
    <title>Login | TTMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== SUPABASE-INSPIRED STYLES ========== */
        :root {
            --primary: #3ecf8e;
            --primary-dark: #2dba7a;
            --primary-light: #e3f7ed;
            --text-primary: #1c1c1c;
            --text-secondary: #666666;
            --background: #ffffff;
            --surface: #f8f9fa;
            --border: #e0e0e0;
            --border-dark: #cccccc;
            --radius: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --space-sm: 12px;
            --space-md: 16px;
            --space-lg: 24px;
            --font-sans: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            color: var(--text-primary);
            background-color: var(--background);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--surface);
        }

        /* ========== LOGIN CARD ========== */
        .login-card {
            width: 100%;
            max-width: 400px;
            background-color: var(--background);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: var(--space-lg);
            margin: var(--space-md);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .login-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--space-lg);
        }

        .login-logo {
            color: var(--primary-dark);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: var(--space-sm);
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-sm);
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* ========== FORM ELEMENTS ========== */
        .form-group {
            margin-bottom: var(--space-md);
        }

        .form-label {
            display: block;
            margin-bottom: var(--space-sm);
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: var(--space-sm) var(--space-md);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            top: 50%;
            left: var(--space-md);
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .input-icon input {
            padding-left: calc(var(--space-md) * 2 + 8px);
        }

        /* ========== BUTTONS ========== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            font-size: 1rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        /* ========== UTILITY CLASSES ========== */
        .text-center {
            text-align: center;
        }

        .mt-1 { margin-top: var(--space-sm); }
        .mt-2 { margin-top: var(--space-md); }
        .mt-3 { margin-top: var(--space-lg); }

        /* ========== RESPONSIVE ADJUSTMENTS ========== */
        @media (max-width: 480px) {
            .login-card {
                padding: var(--space-md);
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">TTMS</div>
            <h1 class="login-title">Faculty of Computing</h1>
            <p class="login-subtitle">Sign in to access your account</p>
        </div>

        <form>
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input class="form-input" type="text" id="username" placeholder="Enter your username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="passwd">Password</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input class="form-input" type="password" id="passwd" placeholder="Enter your password">
                </div>
            </div>

            <div class="form-group mt-3">
                <button type="button" class="btn btn-primary" onclick="login()">
                    <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i> Login
                </button>
            </div>
        </form>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="TTMS_Lib.js"></script>
    <script>
        var ajaxURL = "http://web.fc.utm.my/ttms/web_man_webservice_json.cgi?";

        // Redirect to home if already authenticated
        if (sessionStorage.getItem("web_fc_utm_my_ttms") != null) {
            window.location.href = "home.html";
        }

        function login() {
            var username = $('#username').val();
            var passwd = $('#passwd').val();

            // Check if username or password fields are empty
            if (!username || !passwd) {
                alert("Please fill in both username and password.");
                return;
            }

            var myAuth = { 'entity': 'authentication', 'login': username, 'password': passwd };
            var authGetData = new URLSearchParams(myAuth).toString();

            $.ajax({
                type: "GET",
                url: ajaxURL,
                data: authGetData,
                success: function (response, status, xhr) {
                    console.log("AJAX call succeeded. Response: ", response);

                    var auth;
                    try {
                        auth = JSON.parse(response);
                    } catch (e) {
                        console.log("Failed to parse JSON response. Error: ", e);
                        alert("Unexpected server response. Please try again.");
                        return;
                    }

                    if (auth && auth.length > 0) {
                        var appStorage = {
                            user_auth: auth[0],
                            epoch_last: getEpoch(),
                            data: {}
                        };

                        sessionStorage.setItem("web_fc_utm_my_ttms", JSON.stringify(appStorage));
                        window.location.href = "home.html";
                    } else {
                        console.log("Authentication failed. Response data: ", auth);
                        alert("Incorrect username or password. Please try again.");
                    }
                },
                error: function (xhr, status, error) {
                    console.log("AJAX call failed. Status: ", status, " Error: ", error);
                    if (xhr.status === 0) {
                        alert("Cannot connect to server. Please check your network connection.");
                    } else if (xhr.status === 401) {
                        alert("Unauthorized: Incorrect username or password.");
                    } else {
                        alert("AJAX error: " + xhr.responseText);
                    }
                },
                async: true,
            });
        }

        // Allow login on Enter key press
        $(document).ready(function() {
            $('#username, #passwd').keypress(function(e) {
                if (e.which == 13) {
                    login();
                }
            });
        });
    </script>
</body>
</html>
